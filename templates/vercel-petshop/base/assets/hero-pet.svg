<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="petBgGrad" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Soft background card -->
  <rect width="640" height="480" rx="36" fill="url(#petBgGrad)"/>
  <circle cx="520" cy="110" r="110" fill="#f59e0b" fill-opacity="0.1"/>
  <circle cx="130" cy="370" r="130" fill="#0d9488" fill-opacity="0.1"/>

  <!-- Decorative bubbles / sparkles (Spa & Grooming vibe) -->
  <circle cx="150" cy="120" r="18" stroke="#0d9488" stroke-width="2.5" stroke-opacity="0.4" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="185" cy="95" r="10" stroke="#0d9488" stroke-width="2" stroke-opacity="0.35" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="485" cy="150" r="14" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.45" fill="#ffffff" fill-opacity="0.5"/>
  <path d="M460 80 L465 92 L477 97 L465 102 L460 114 L455 102 L443 97 L455 92 Z" fill="#f59e0b" fill-opacity="0.55"/>
  <path d="M120 210 L123 218 L131 221 L123 224 L120 232 L117 224 L109 221 L117 218 Z" fill="#0d9488" fill-opacity="0.5"/>

  <!-- Central elevated pedestal / cushion -->
  <ellipse cx="320" cy="390" rx="210" ry="34" fill="#0d9488" fill-opacity="0.16"/>
  <ellipse cx="320" cy="382" rx="180" ry="24" fill="#0d9488" fill-opacity="0.22"/>

  <!-- Friendly Golden Dog Illustration (Left-Center) -->
  <g transform="translate(155, 115)">
    <!-- Body -->
    <path d="M65 165 C55 210 60 255 68 268 L162 268 C170 255 175 210 165 165 Z" fill="url(#honeyGrad)"/>
    <!-- Chest fur patch -->
    <path d="M90 175 C105 195 125 195 140 175 C135 215 125 235 115 245 C105 235 95 215 90 175 Z" fill="#fef3c7"/>
    <!-- Left & Right Ears -->
    <path d="M62 65 C32 72 25 115 42 138 C54 145 68 125 72 95 Z" fill="#b45309"/>
    <path d="M168 65 C198 72 205 115 188 138 C176 145 162 125 158 95 Z" fill="#b45309"/>
    <!-- Head -->
    <rect x="62" y="45" width="106" height="102" rx="48" fill="url(#honeyGrad)"/>
    <!-- Snout / Muzzle -->
    <ellipse cx="115" cy="112" rx="32" ry="24" fill="#fef3c7"/>
    <!-- Nose -->
    <ellipse cx="115" cy="102" rx="11" ry="8" fill="#1e293b"/>
    <!-- Smile -->
    <path d="M103 116 Q115 126 127 116" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Tongue -->
    <path d="M110 121 Q115 135 121 121 Z" fill="#fb7185"/>
    <!-- Eyes -->
    <circle cx="90" cy="84" r="6.5" fill="#1e293b"/>
    <circle cx="88" cy="82" r="2" fill="#ffffff"/>
    <circle cx="140" cy="84" r="6.5" fill="#1e293b"/>
    <circle cx="138" cy="82" r="2" fill="#ffffff"/>
    <!-- Spa Bandana / Scarf -->
    <path d="M68 148 Q115 168 162 148 L145 185 Q115 198 85 185 Z" fill="url(#accentGrad)"/>
    <circle cx="115" cy="168" r="6" fill="#ffffff"/>
    <!-- Front Paws -->
    <rect x="78" y="248" width="26" height="24" rx="12" fill="#fef3c7"/>
    <rect x="126" y="248" width="26" height="24" rx="12" fill="#fef3c7"/>
  </g>

  <!-- Elegant Cat Illustration (Right-Center) -->
  <g transform="translate(335, 160)">
    <!-- Tail -->
    <path d="M125 205 C165 205 175 155 155 135" stroke="#334155" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Body -->
    <path d="M40 125 C32 165 36 205 44 222 L126 222 C134 205 138 165 130 125 Z" fill="#475569"/>
    <!-- White chest -->
    <ellipse cx="85" cy="165" rx="22" ry="30" fill="#f8fafc"/>
    <!-- Ears -->
    <polygon points="42,58 34,12 72,38" fill="#334155"/>
    <polygon points="46,52 40,22 66,40" fill="#fda4af"/>
    <polygon points="128,58 136,12 98,38" fill="#334155"/>
    <polygon points="124,52 130,22 104,40" fill="#fda4af"/>
    <!-- Head -->
    <circle cx="85" cy="75" r="46" fill="#475569"/>
    <!-- Eyes -->
    <ellipse cx="67" cy="70" rx="6" ry="7" fill="#10b981"/>
    <circle cx="65" cy="68" r="2" fill="#ffffff"/>
    <ellipse cx="103" cy="70" rx="6" ry="7" fill="#10b981"/>
    <circle cx="101" cy="68" r="2" fill="#ffffff"/>
    <!-- Nose & Whiskers -->
    <polygon points="81,82 89,82 85,88" fill="#fda4af"/>
    <path d="M76 92 Q85 98 94 92" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <line x1="35" y1="80" x2="58" y2="83" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="88" x2="58" y2="88" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="80" x2="112" y2="83" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="88" x2="112" y2="88" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Collar with bell -->
    <path d="M52 112 Q85 124 118 112" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="85" cy="121" r="7" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <!-- Paws -->
    <ellipse cx="64" cy="218" rx="13" ry="9" fill="#f8fafc"/>
    <ellipse cx="106" cy="218" rx="13" ry="9" fill="#f8fafc"/>
  </g>

  <!-- Floating Heart / Vet Cross Badge (Top Center) -->
  <g transform="translate(288, 42)">
    <circle cx="32" cy="32" r="32" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
    <path d="M32 48 C32 48 14 36 14 23 C14 16 19.5 12 25 12 C28.5 12 31 14 32 16.5 C33 14 35.5 12 39 12 C44.5 12 50 16 50 23 C50 36 32 48 32 48 Z" fill="#0d9488"/>
    <path d="M29 21 H35 V26 H40 V32 H35 V37 H29 V32 H24 V26 H29 Z" fill="#ffffff"/>
  </g>
</svg>
